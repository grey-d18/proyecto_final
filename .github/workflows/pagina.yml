# Publica la app web (carpeta web/) en GitHub Pages cada vez que se sube un cambio a main.
# Antes, una sola vez: en GitHub, Settings → Pages → Source: «GitHub Actions».
name: Publicar la app web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pagina.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: publicacion
        uses: actions/deploy-pages@v4
